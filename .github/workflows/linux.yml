name: "Linux build"

# Builds Kothon for 64-bit Linux as a .deb (Ubuntu 22.04 and newer, Debian 12,
# Linux Mint 21 and newer). Built on Ubuntu 22.04 so the package runs on that
# and everything newer.
#
# - Every push to main builds a test package, kept as a workflow artifact
#   ("kothon-linux-x64") for 30 days.
# - Run it by hand with a release tag (v0.2.0) to also attach the .deb to that
#   GitHub release. Only do that after it has been tested.
#
# The Linux build doesn't update itself yet: Tauri's updater only updates
# AppImages, so .deb users install new versions from Releases.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Release tag to publish the tested .deb to (e.g. v0.2.0). Leave empty for a test build."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/linux.yml"

concurrency:
  group: linux-${{ github.ref }}-${{ inputs.release-tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Kothon $VERSION"
          if [ -n "${{ inputs.release-tag }}" ] && [ "${{ inputs.release-tag }}" != "v$VERSION" ]; then
            echo "::error::release-tag ${{ inputs.release-tag }} doesn't match the app version v$VERSION in tauri.conf.json"
            exit 1
          fi

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev \
            libgtk-layer-shell0 libgtk-layer-shell-dev xvfb

      # transcribe-cpp's Vulkan GPU backend needs the Vulkan SDK (headers and
      # glslc) to build. Users need nothing extra: Vulkan comes with the GPU
      # driver, and the CPU backend is the fallback.
      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-jammy.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk mesa-vulkan-drivers

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: linux-x64-v1
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install

      # build.rs copies libtranscribe and the ggml backends into
      # src-tauri/transcribe-libs/, which the .deb installs to /usr/lib/Kothon.
      - name: Build .deb
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: bun run tauri build --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Check the package
        run: |
          set -euo pipefail
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          dpkg-deb -c "$DEB" > listing.txt
          for pattern in 'usr/bin/kothon$' 'usr/lib/Kothon/libtranscribe\.so' 'usr/lib/Kothon/libggml-cpu.*\.so'; do
            grep -Eq "$pattern" listing.txt || { echo "::error::$DEB is missing $pattern"; cat listing.txt; exit 1; }
          done
          root=$(mktemp -d)
          dpkg-deb -x "$DEB" "$root"
          HANDY_NO_GTK_LAYER_SHELL=1 LD_LIBRARY_PATH="$root/usr/lib/Kothon" \
            xvfb-run -a "$root/usr/bin/kothon" --list-devices | tee devices.txt
          grep -q "kind=cpu" devices.txt || { echo "::error::No CPU compute device found"; exit 1; }

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: kothon-linux-x64
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  publish:
    if: inputs.release-tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kothon-linux-x64
          path: linux

      - name: Publish to ${{ inputs.release-tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber linux/*.deb
